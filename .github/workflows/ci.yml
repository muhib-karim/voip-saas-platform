name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests on Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The wallet, webhook, billing and token tests need a real database.
      # REQUIRE_DB_TESTS turns "no database" into a failure instead of a skip.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voip_test
      REQUIRE_DB_TESTS: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # The Expo workspace is not needed here, so only install what is used.
      - name: Install dependencies
        run: npm ci -w packages/backend --no-audit --no-fund

      - name: Lint
        run: npm run lint --workspace=packages/backend

      - name: Unit, HTTP and database tests
        run: npm test --workspace=packages/backend

  frontend:
    name: Frontend (lint + type-check + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci -w packages/frontend --no-audit --no-fund

      - name: Lint
        run: npm run lint --workspace=packages/frontend

      - name: Type-check
        run: npm run type-check --workspace=packages/frontend

      - name: Unit tests
        run: npm test --workspace=packages/frontend

      - name: Build
        run: npm run build --workspace=packages/frontend

      # The bundle must be the TypeScript app: it is the only code that calls
      # /auth/refresh. A stray .jsx/.js copy of the app would silently win
      # Vite's module resolution again.
      - name: Check the built bundle is the TypeScript app
        run: grep -q "/auth/refresh" packages/frontend/dist/assets/*.js

  mobile:
    name: Mobile (lint + type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci -w packages/mobile --no-audit --no-fund

      - name: Lint
        run: npm run lint --workspace=packages/mobile

      - name: Type-check
        run: npm run type-check --workspace=packages/mobile

  root-scripts:
    name: Root scripts (npm run lint / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (all workspaces)
        run: npm ci --no-audit --no-fund

      # What a contributor runs before opening a pull request. The backend's
      # database tests skip here (no TEST_DATABASE_URL); the backend job above
      # is the one that runs them.
      - name: npm run lint (every workspace)
        run: npm run lint

      - name: npm test (all workspaces that define tests)
        run: npm test

      - name: npm run build (all workspaces that define a build)
        run: npm run build
