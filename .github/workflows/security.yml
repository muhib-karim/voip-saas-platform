name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Mondays 06:00 UTC: new advisories appear without any code change.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (backend + frontend, high and above)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm audit works from package-lock.json; nothing needs to be installed.
      # Development dependencies are included on purpose.
      - name: Backend
        run: npm audit --audit-level=high --workspace=packages/backend

      - name: Frontend
        run: npm audit --audit-level=high --workspace=packages/frontend

  npm-audit-mobile:
    name: npm audit (mobile, report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Not a gate. Every high/critical finding in the Expo 50 tree needs an Expo,
    # React Native or React Navigation major upgrade (see README, "Known
    # advisories"). The job stays so the list is visible on every run.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Report only: the findings are printed and flagged as a warning, but the
      # job passes so it never blocks a merge.
      - name: Mobile
        run: |
          npm audit --audit-level=high --workspace=packages/mobile \
            || echo "::warning title=Mobile advisories::Known Expo 50 advisories remain (see README, Known advisories)"

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The report is printed in the log; uploading it as an artifact is not
          # needed and fails whenever the account's artifact storage is full.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          # Only needed if the repository moves to an organisation account.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
