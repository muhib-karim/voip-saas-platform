  <text x="80" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#7dd3fc" letter-spacing="1">NODE.JS · EXPRESS · REACT · WEBRTC · POSTGRESQL · TELNYX · STRIPE</text>
