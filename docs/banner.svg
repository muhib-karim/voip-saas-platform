    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280"/>
    <path d="M160 0V320M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320"/>
  </g>

  <!-- motif: handset with signal arcs and a waveform -->
  <circle cx="1060" cy="160" r="150" fill="url(#glow)"/>
  <g transform="translate(1000 100)">
    <path d="M22 8c6-6 15-6 20 0l14 16c5 6 5 14-1 19l-9 8c6 14 17 25 31 31l8-9c5-6 13-6 19-1l16 14c6 5 6 14 0 20l-11 11c-9 9-23 11-35 5C50 109 19 78 6 44 1 32 3 18 12 9z"
          fill="none" stroke="url(#accent)" stroke-width="7" stroke-linejoin="round"/>
    <g fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round">
      <path d="M92 26a32 32 0 0 1 32 32" stroke-opacity="0.95"/>
      <path d="M94 4a56 56 0 0 1 52 52" stroke-opacity="0.7"/>
      <path d="M96 -18a80 80 0 0 1 72 72" stroke-opacity="0.45"/>
    </g>
  </g>
  <path d="M760 250h40l12-22 16 44 18-70 18 84 14-48 12 12h40l12-18 14 30 12-12h120"
